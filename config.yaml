# Hourly Energy Consumption Forecasting Pipeline Configuration

data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  target_column: "consumption"
  datetime_column: "datetime"

features:
  # Temporal features
  temporal:
    - "hour"
    - "day_of_week"
    - "month"
    - "year"
    - "day_of_year"
    - "week_of_year"
    - "is_weekend"
    - "is_month_start"
    - "is_month_end"

  # Lag features
  lags:
    - 1
    - 2
    - 3
    - 24  # Same hour yesterday
    - 168 # Same hour last week

  # Rolling window features
  rolling_windows:
    - window: 6
      functions: ["mean", "std"]
    - window: 24
      functions: ["mean", "std", "min", "max"]
    - window: 168
      functions: ["mean"]

  # Cyclical encoding for temporal features
  cyclical_features:
    - "hour"
    - "day_of_week"
    - "month"

model:
  # Train/validation/test split ratios
  test_size: 0.2
  validation_size: 0.1

  # Models to train
  models:
    - name: "random_forest"
      type: "RandomForest"
      params:
        n_estimators: 100
        max_depth: 20
        min_samples_split: 5
        random_state: 42
        n_jobs: -1

    - name: "xgboost"
      type: "XGBoost"
      params:
        n_estimators: 100
        max_depth: 6
        learning_rate: 0.1
        objective: "reg:squarederror"
        random_state: 42
        n_jobs: -1

    - name: "lightgbm"
      type: "LightGBM"
      params:
        n_estimators: 100
        max_depth: 8
        learning_rate: 0.1
        objective: "regression"
        random_state: 42
        n_jobs: -1
        verbose: -1

  # Cross-validation
  cv_folds: 5
  cv_strategy: "time_series_split"

evaluation:
  metrics:
    - "mae"
    - "mse"
    - "rmse"
    - "mape"
    - "r2"

output:
  models_path: "models/"
  reports_path: "reports/"
  predictions_path: "predictions/"
